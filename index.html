<script>
const australianBanks = {
  'CommBank': {
    'Credit Card': 18.2,
    'Personal Loan': 9.5,
    'Car Loan': 7.2,
    'Home Loan': 6.8,
    'BNPL': 0
  },
  'NAB': {
    'Credit Card': 16.5,
    'Personal Loan': 9.8,
    'Car Loan': 7.5,
    'Home Loan': 6.9,
    'BNPL': 0
  },
  'Westpac': {
    'Credit Card': 15.99,
    'Personal Loan': 10.2,
    'Car Loan': 7.8,
    'Home Loan': 7.0,
    'BNPL': 0
  },
  'ANZ': {
    'Credit Card': 17.8,
    'Personal Loan': 9.9,
    'Car Loan': 7.6,
    'Home Loan': 6.85,
    'BNPL': 0
  },
  'HSBC': {
    'Credit Card': 14.9,
    'Personal Loan': 8.9,
    'Car Loan': 7.1,
    'Home Loan': 6.7,
    'BNPL': 0
  },
  'Coles Credit': {
    'Credit Card': 19.99,
    'BNPL': 0
  },
  'Kogan Card': {
    'Credit Card': 22.9,
    'BNPL': 0
  },
  'Afterpay': {
    'BNPL': 0,
    'Buy Now Pay Later': 0
  },
  'Zip Pay': {
    'BNPL': 0,
    'Buy Now Pay Later': 0
  },
  'Latitude': {
    'BNPL': 21.5,
    'Buy Now Pay Later': 21.5
  },
  'Flexi Loan': {
    'Personal Loan': 17.5,
    'Short Term Loan': 17.5
  },
  'Boost': {
    'Personal Loan': 16.9
  },
  'Mozo': {
    'Personal Loan': 15.5
  },
  'Others': {
    'Custom Debt': 0
  }
};

const money = n => '$' + Math.round(Number(n || 0)).toLocaleString('en-AU');

let RESET_PASSCODE = localStorage.getItem('appPasscode') || '1234';
let currentBankBalance = parseFloat(localStorage.getItem('bankBalance') || '0');
let totalSaved = parseFloat(localStorage.getItem('totalSaved') || '0');
let savingsGoal = parseFloat(localStorage.getItem('savingsGoal') || '50');
let planStartDate = new Date(localStorage.getItem('planStartDate') || '2026-05-27');
let debtOriginal = parseFloat(localStorage.getItem('originalDebt') || '0');
let isLight = localStorage.getItem('isLightMode') === 'true';
let selectedTermYears = parseInt(localStorage.getItem('termYears') || '5', 10);
let paymentHistory = [];
let debts = [];

function saveAll() {
  localStorage.setItem('bankBalance', String(currentBankBalance));
  localStorage.setItem('totalSaved', String(totalSaved));
  localStorage.setItem('savingsGoal', String(savingsGoal));
  localStorage.setItem('planStartDate', planStartDate.toISOString().slice(0, 10));
  localStorage.setItem('isLightMode', String(isLight));
  localStorage.setItem('appPasscode', RESET_PASSCODE);
  localStorage.setItem('originalDebt', String(debtOriginal));
  localStorage.setItem('termYears', String(selectedTermYears));
  localStorage.setItem('debtsData', JSON.stringify(debts));
}

function loadState() {
  const savedDebts = localStorage.getItem('debtsData');
  debts = savedDebts ? JSON.parse(savedDebts) : [];
  debts = debts.map(d => ({
    id: d.id || crypto.randomUUID(),
    bank: d.bank || 'CommBank',
    product: d.product || 'Credit Card',
    balance: Number(d.balance || 0),
    rate: Number(d.rate || 0),
    minPayment: Number(d.minPayment || 0)
  }));
}

function getDebtRows() {
  return debts;
}

function calculateAUMinPayment(balance, interestRate) {
  if (balance <= 0) return 0;
  const monthlyInterest = balance * (interestRate / 100 / 12);
  const monthlyPrincipal = balance * 0.01;
  return Math.max(Math.ceil(monthlyInterest + monthlyPrincipal), 10);
}

function recalcDebtMinPayments() {
  debts = debts.map(d => {
    const rate = d.bank === 'Others'
      ? Number(d.rate || 0)
      : Number((australianBanks[d.bank] && australianBanks[d.bank][d.product]) || 0);
    return {
      ...d,
      rate,
      minPayment: calculateAUMinPayment(Number(d.balance || 0), rate)
    };
  });
}

function totalDebtBalance() {
  return debts.reduce((sum, d) => sum + Number(d.balance || 0), 0);
}

function totalMinMonthly() {
  return debts.reduce((sum, d) => sum + Number(d.minPayment || 0), 0);
}

function getAutoWeeklyPayment() {
  const totalDebt = totalDebtBalance();
  if (totalDebt <= 0) return 0;
  return Math.ceil(totalDebt / (selectedTermYears * 52));
}

function updateHero() {
  const totalBalance = totalDebtBalance();
  const autoWeekly = getAutoWeeklyPayment();
  document.getElementById('heroTotalDebt').innerHTML =
    `${money(totalBalance + totalMinMonthly())}<span style="font-size: 0.55rem; color: var(--text2); display:block; margin-top:4px; font-family:'DM Sans', sans-serif; font-weight:400;">${money(totalBalance)} + ${money(totalMinMonthly())}/mth</span>`;
  document.getElementById('heroBankDisplay').textContent = money(currentBankBalance);
  document.getElementById('heroSurplus').textContent = money(getMonthlySurplus());
  document.getElementById('heroWeeklyPayment').textContent = money(autoWeekly);
  document.getElementById('totalSavingsDisplay').textContent = money(totalSaved);
  document.getElementById('sumMinWeeklyDisplay').textContent = money(totalMinMonthly());
  document.getElementById('debtCountBadge').textContent = debts.length;
  document.getElementById('planTotalDebt').textContent = money(totalBalance);
  document.getElementById('planRequiredWeekly').textContent = money(autoWeekly);
  document.getElementById('autoPaymentPreview').textContent = money(autoWeekly);
  document.getElementById('weeksPaidBadge').textContent = `${Math.max(0, Math.round(totalSaved / Math.max(1, autoWeekly)))} paid`;
}

function getMonthlySurplus() {
  const weeklySalary = parseFloat(document.getElementById('weeklySalary')?.value || '0');
  const additionalIncome = parseFloat(document.getElementById('additionalIncome')?.value || '0');
  const monthlyIncome = (weeklySalary * 52 / 12) + additionalIncome;
  const expenses = ['rent','carLoan','loanPayment','coffee','zip','other','extra1','extra2']
    .reduce((sum, id) => sum + (parseFloat(document.getElementById(id)?.value || '0') || 0), 0);
  document.getElementById('totalIncomeDisplay').textContent = Math.round(monthlyIncome).toLocaleString('en-AU');
  document.getElementById('totalExpensesDisplay').textContent = Math.round(expenses).toLocaleString('en-AU');
  document.getElementById('surplusDisplay').textContent = Math.round(monthlyIncome - expenses).toLocaleString('en-AU');
  return monthlyIncome - expenses;
}

function updateProgress(totalBalance) {
  if (!debtOriginal || debtOriginal < totalBalance) {
    debtOriginal = totalBalance || 1;
  }
  const paid = Math.max(0, debtOriginal - totalBalance);
  const pct = Math.min(100, Math.round((paid / debtOriginal) * 100));
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressPercent').textContent = pct + '% paid off';
  document.getElementById('debtFreeBanner').classList.toggle('visible', totalBalance <= 0 && debtOriginal > 0);
}

function updateWeeksRemaining() {
  const totalDebt = totalDebtBalance();
  const weeklyAmount = getAutoWeeklyPayment();
  if (totalDebt > 0 && weeklyAmount > 0) {
    const weeks = Math.ceil(totalDebt / weeklyAmount);
    const target = new Date(planStartDate);
    target.setDate(target.getDate() + weeks * 7);
    document.getElementById('weeksRemaining').textContent = weeks;
    document.getElementById('planTargetDate').textContent = target.toLocaleDateString('en-AU');
    document.getElementById('targetDateLabel').textContent = `Target: ${target.toLocaleDateString('en-AU')}`;
  } else {
    document.getElementById('weeksRemaining').textContent = '--';
    document.getElementById('planTargetDate').textContent = '—';
    document.getElementById('targetDateLabel').textContent = 'Select term';
  }
}

function saveDebts() {
  localStorage.setItem('debtsData', JSON.stringify(debts));
}

function renderDebtTable() {
  const tbody = document.getElementById('debtTableBody');
  tbody.innerHTML = '';

  if (!debts.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="padding:16px; text-align:center; color: var(--text2);">📋 Click + Add Debt to get started</td></tr>';
    recalcDebtMinPayments();
    updateHero();
    updateProgress(0);
    updateWeeksRemaining();
    buildDestroyPlan();
    updateWeeksTracker();
    saveAll();
    return;
  }

  debts.forEach((row, index) => {
    const tr = document.createElement('tr');
    tr.dataset.row = '1';
    tr.dataset.id = row.id;

    const tdBank = document.createElement('td');
    const bankSelect = document.createElement('select');
    bankSelect.className = 'bank-select';
    Object.keys(australianBanks).forEach(bankName => {
      const o = document.createElement('option');
      o.value = bankName;
      o.textContent = bankName;
      if (bankName === row.bank) o.selected = true;
      bankSelect.appendChild(o);
    });
    tdBank.appendChild(bankSelect);

    const tdProduct = document.createElement('td');
    const productSelect = document.createElement('select');
    productSelect.className = 'bank-select';
    tdProduct.appendChild(productSelect);

    const tdBal = document.createElement('td');
    const balInp = document.createElement('input');
    balInp.type = 'number';
    balInp.value = row.balance;
    balInp.className = 'balance-input';
    balInp.step = '10';
    tdBal.appendChild(balInp);

    const tdRate = document.createElement('td');
    const rateInp = document.createElement('input');
    rateInp.type = 'number';
    rateInp.value = row.rate;
    rateInp.className = 'rate-input';
    rateInp.step = '0.1';
    tdRate.appendChild(rateInp);

    const tdMin = document.createElement('td');
    const minInp = document.createElement('input');
    minInp.type = 'number';
    minInp.value = row.minPayment;
    minInp.className = 'min-input';
    minInp.readOnly = true;
    tdMin.appendChild(minInp);

    const tdQ = document.createElement('td');
    const qBtn = document.createElement('button');
    qBtn.textContent = 'Pay $50';
    qBtn.className = 'btn-sm';
    tdQ.appendChild(qBtn);

    const tdDel = document.createElement('td');
    const delBtn = document.createElement('button');
    delBtn.textContent = '✖';
    delBtn.className = 'btn-sm btn-danger';
    tdDel.appendChild(delBtn);

    tr.append(tdBank, tdProduct, tdBal, tdRate, tdMin, tdQ, tdDel);
    tbody.appendChild(tr);

    function refreshProductOptions() {
      const selectedBank = bankSelect.value;
      productSelect.innerHTML = '';
      const products = australianBanks[selectedBank] || {};
      Object.keys(products).forEach(productType => {
        const o = document.createElement('option');
        o.value = productType;
        o.textContent = productType;
        if (productType === row.product) o.selected = true;
        productSelect.appendChild(o);
      });
      const isOthers = selectedBank === 'Others';
      rateInp.readOnly = !isOthers;
      rateInp.style.opacity = isOthers ? '1' : '0.7';
      if (!isOthers) rateInp.value = australianBanks[selectedBank]?.[productSelect.value] ?? 0;
    }

    function syncRow() {
      const selectedBank = bankSelect.value;
      const selectedProduct = productSelect.value;
      const balance = Number(balInp.value || 0);
      const rate = selectedBank === 'Others'
        ? Number(rateInp.value || 0)
        : Number(australianBanks[selectedBank]?.[selectedProduct] || 0);

      row.bank = selectedBank;
      row.product = selectedProduct;
      row.balance = balance;
      row.rate = rate;
      row.minPayment = calculateAUMinPayment(balance, rate);
      minInp.value = row.minPayment;

      recalcDebtMinPayments();
      updateHero();
      updateProgress(totalDebtBalance());
      updateWeeksRemaining();
      buildDestroyPlan();
      updateWeeksTracker();
      saveDebts();
      saveAll();
    }

    bankSelect.onchange = () => {
      refreshProductOptions();
      if (bankSelect.value !== 'Others') {
        rateInp.value = australianBanks[bankSelect.value][productSelect.value] ?? 0;
      }
      syncRow();
    };

    productSelect.onchange = syncRow;
    balInp.oninput = syncRow;
    rateInp.oninput = () => {
      if (bankSelect.value === 'Others') syncRow();
    };

    qBtn.onclick = () => {
      applyDebtPayment(50);
      alert(`✅ Paid $50 to your highest-interest debt`);
    };

    delBtn.onclick = () => {
      debts.splice(index, 1);
      renderDebtTable();
    };

    refreshProductOptions();
    syncRow();
  });

  recalcDebtMinPayments();
  updateHero();
  updateProgress(totalDebtBalance());
  updateWeeksRemaining();
  buildDestroyPlan();
  updateWeeksTracker();
  saveAll();
}

function addNewDebtRow() {
  debts.push({
    id: crypto.randomUUID(),
    bank: 'CommBank',
    product: 'Credit Card',
    balance: 0,
    rate: australianBanks['CommBank']['Credit Card'],
    minPayment: 0
  });
  renderDebtTable();
}

function applyDebtPayment(amount) {
  let remaining = Number(amount || 0);
  if (remaining <= 0 || totalDebtBalance() <= 0) return;

  const sorted = debts
    .map(d => ({ ...d }))
    .sort((a, b) => b.rate - a.rate);

  for (const d of sorted) {
    if (remaining <= 0) break;
    const pay = Math.min(d.balance, remaining);
    d.balance -= pay;
    remaining -= pay;
  }

  debts = sorted.map(updated => {
    const original = debts.find(d => d.id === updated.id) || updated;
    return { ...original, balance: updated.balance };
  });

  recalcDebtMinPayments();
  renderDebtTable();
}

function buildDestroyPlan() {
  const rows = debts.filter(r => r.balance > 0).sort((a, b) => b.rate - a.rate);
  const container = document.getElementById('planStepsContainer');
  if (!rows.length) {
    container.innerHTML = '<div class="tip">📋 Add debts to see your personalized payoff plan.</div>';
    document.getElementById('strategyComparison').innerHTML = 'No debts added yet.';
    return;
  }
  container.innerHTML = rows.map((r, i) =>
    `<div class="plan-step"><div class="step-num">${i + 1}</div><div class="step-body"><h4>${r.bank}</h4><p>Balance: <span class="highlight">${money(r.balance)}</span> | Rate: <span class="warn">${r.rate}%</span> | Min monthly: <span class="good">${money(r.minPayment)}</span></p></div></div>`
  ).join('');
  const highest = rows[0];
  document.getElementById('strategyComparison').innerHTML =
    `🔥 Pay highest interest first: <strong>${highest.bank}</strong> (${highest.rate}%). Focus on eliminating high-interest debts first.`;
}

function updateWeeksTracker() {
  const tracker = document.getElementById('weeklyTracker');
  const start = new Date(planStartDate);
  tracker.innerHTML = '';
  const autoPay = getAutoWeeklyPayment();
  const currentTarget = debts.filter(r => r.balance > 0).sort((a, b) => b.rate - a.rate)[0];

  for (let i = 0; i < 156; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i * 7);
    const chip = document.createElement('div');
    chip.className = 'week-chip';
    const shortName = currentTarget ? currentTarget.bank.split(' ')[0] : 'N/A';
    chip.innerHTML = `<div class="wk">${shortName}</div><div class="amt">${money(autoPay)}</div>`;
    chip.onclick = () => {
      if (currentBankBalance >= autoPay && autoPay > 0) {
        paymentHistory.push({
          week: i,
          payment: autoPay,
          bankBalanceBefore: currentBankBalance,
          debtsStateBefore: JSON.stringify(debts)
        });
        currentBankBalance -= autoPay;
        totalSaved += autoPay;
        applyDebtPayment(autoPay);
        updateBankDisplay();
        updateSavingsDisplay();
        saveAll();
      } else {
        alert('Not enough bank balance for this payment.');
      }
    };
    tracker.appendChild(chip);
  }
}

function updateBankDisplay() {
  document.getElementById('heroBankDisplay').textContent = money(currentBankBalance);
}

function updateSavingsDisplay() {
  document.getElementById('totalSavingsDisplay').textContent = money(totalSaved);
}

function loadDebts() {
  loadState();
  renderDebtTable();
}

function resetDebtsToZero() {
  debts = debts.map(d => ({ ...d, balance: 0, minPayment: 0 }));
  renderDebtTable();
  alert('✅ All debts reset to $0.');
}

function factoryReset() {
  localStorage.clear();
  location.reload();
}

function updateIncomeExpenseTotals() {
  getMonthlySurplus();
  updateHero();
  saveAll();
}

function setTheme() {
  document.body.classList.toggle('light', isLight);
  document.getElementById('darkToggleBtn').textContent = isLight ? '🌙 Dark' : '☀️ Light';
}

function setActiveTab(tabId) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tabId));
  document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.toggle('active', panel.id === tabId));
}

document.addEventListener('DOMContentLoaded', () => {
  loadState();
  setTheme();
  renderDebtTable();
  updateBankDisplay();
  updateSavingsDisplay();
  updateIncomeExpenseTotals();
  updateWeeksTracker();
  buildDestroyPlan();
  updateWeeksRemaining();

  document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => setActiveTab(btn.dataset.tab));

  document.getElementById('darkToggleBtn').onclick = () => {
    isLight = !isLight;
    setTheme();
    saveAll();
  };

  document.getElementById('addDebtRowBtn').onclick = addNewDebtRow;
  document.getElementById('updateTermBtn').onclick = () => {
    selectedTermYears = parseInt(document.getElementById('termSelector').value, 10);
    updateHero();
    updateWeeksRemaining();
    updateWeeksTracker();
    saveAll();
  };

  document.getElementById('manualSalaryBtn').onclick = () => {
    const weeklySalary = parseFloat(document.getElementById('weeklySalary').value || '0');
    currentBankBalance += weeklySalary;
    updateBankDisplay();
    saveAll();
    alert(`💼 Payday added: ${money(weeklySalary)}`);
  };

  document.getElementById('quickAddPaymentBtn').onclick = () => {
    const amt = parseFloat(prompt('Enter extra payment amount:', '50') || '0');
    if (amt > 0) applyDebtPayment(amt);
  };

  document.getElementById('resetDebtBtn').onclick = resetDebtsToZero;
  document.getElementById('resetDebtBtnSettings').onclick = resetDebtsToZero;
  document.getElementById('resetFullBtn').onclick = factoryReset;
  document.getElementById('resetFullBtnSettings').onclick = factoryReset;

  document.getElementById('updateBankBtn').onclick = () => {
    currentBankBalance = parseFloat(document.getElementById('bankBalanceInput').value || '0');
    updateBankDisplay();
    saveAll();
  };

  document.getElementById('updateSavingsGoalBtn').onclick = () => {
    savingsGoal = parseFloat(document.getElementById('savingsGoalInput').value || '50');
    saveAll();
  };

  document.getElementById('changePasscodeBtn').onclick = () => {
    const v = document.getElementById('newPasscodeInput').value.trim();
    if (/^\d{4}$/.test(v)) {
      RESET_PASSCODE = v;
      saveAll();
      alert('Passcode updated.');
    } else {
      alert('Enter a 4-digit passcode.');
    }
  };

  ['weeklySalary','additionalIncome','rent','carLoan','loanPayment','coffee','zip','other','extra1','extra2'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      updateIncomeExpenseTotals();
      saveAll();
    });
  });

  ['planStartDate'].forEach(id => {
    document.getElementById(id).addEventListener('change', e => {
      planStartDate = new Date(e.target.value);
      updateWeeksRemaining();
      updateWeeksTracker();
      saveAll();
    });
  });

  document.getElementById('planStartDate').value = localStorage.getItem('planStartDate') || '2026-05-27';
  document.getElementById('termSelector').value = String(selectedTermYears);
  document.getElementById('bankBalanceInput').value = String(currentBankBalance);
  document.getElementById('savingsGoalInput').value = String(savingsGoal);
  document.getElementById('startDatePreview').textContent = planStartDate.toLocaleDateString('en-AU');

  saveAll();
});
</script>
