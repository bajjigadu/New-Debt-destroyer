<style>
  :root {
    --bg: #0a0a0f;

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* HEADER */

    background: linear-gradient(135deg, #1a1a2e, #16213e);

<script>
// ============================================================
// APP STATE
// ============================================================
const DEFAULT_STATE = {
  version: 4,
  country: "Australia",
  currency: "$",

  finances: {
    bankBalance: 0,
    totalSaved: 0,
    totalDailyExpenses: 0
  },

  income: {
    weeklySalary: 0,
    additionalWeeklyIncome: 0
  },

  debts: [],
  dailyExpenses: [],
  salaryHistory: [],

  settings: {
    termYears: 5,
    startDate: null,
    strategy: "avalanche",
    applyInterest: false,
    showWarnings: true
  },

  tracker: {
    paidWeeks: {}
  },

  paymentPlan: []
};

let appState = JSON.parse(JSON.stringify(DEFAULT_STATE));
let saveTimer = null;
let trackerFilter = 'all';

// ============================================================
// STORAGE
// ============================================================
localforage.config({ name: 'DebtDestroyerPro', storeName: 'appdata' });

async function loadState() {
  try {
    const saved = await localforage.getItem('debtDestroyerState');
    if (saved) {
      appState = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), saved);
      // Ensure nested objects exist
      if (!appState.finances) appState.finances = DEFAULT_STATE.finances;
      if (!appState.income) appState.income = DEFAULT_STATE.income;
      if (!appState.settings) appState.settings = DEFAULT_STATE.settings;
      if (!appState.tracker) appState.tracker = { paidWeeks: {} };
      if (!appState.tracker.paidWeeks) appState.tracker.paidWeeks = {};
      if (!Array.isArray(appState.debts)) appState.debts = [];
      if (!Array.isArray(appState.dailyExpenses)) appState.dailyExpenses = [];
      if (!Array.isArray(appState.salaryHistory)) appState.salaryHistory = [];
    }
    checkAutoCleanup();
    renderAll();
    updateLastSaved();
  } catch(e) {
    console.error('Load error:', e);
    renderAll();
  }
}

async function saveState() {
  try {
    await localforage.setItem('debtDestroyerState', appState);
    showSaveIndicator();
    updateLastSaved();
  } catch(e) {
    console.error('Save error:', e);
  }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 600);
}

function showSaveIndicator() {
  const el = document.getElementById('saveIndicator');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function updateLastSaved() {
  const el = document.getElementById('lastSaved');
  if (el) el.textContent = 'Last saved: ' + new Date().toLocaleTimeString();
}

// ============================================================
// AUTO CLEANUP
// ============================================================
function checkAutoCleanup() {
  if (!appState.settings.startDate) return;
  const end = new Date(appState.settings.startDate);
  end.setFullYear(end.getFullYear() + (appState.settings.termYears || 5) + 1);
  if (new Date() > end) {
    if (confirm('Your debt plan period has ended. Clear all data?')) {
      resetApp();
    }
  }
}

// ============================================================
// TAB NAVIGATION
// ============================================================
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('tab-' + tab).classList.add('active');
    renderTab(tab);
  });
});

function renderTab(tab) {
  switch(tab) {
    case 'dashboard': renderDashboard(); break;
    case 'debts': renderDebts(); break;
    case 'income': renderIncome(); break;
    case 'expenses': renderExpenses(); break;
    case 'tracker': renderTracker(); break;
    case 'plan': renderPlan(); break;
    case 'salary': renderSalary(); break;
    case 'settings': renderSettings(); break;
  }
}

function renderAll() {
  renderDashboard();
  renderDebts();
  renderIncome();
  renderExpenses();
  renderTracker();
  renderPlan();
  renderSalary();
  renderSettings();
}

// ============================================================
// CURRENCY
// ============================================================
function cur(amount) {
  const sym = appState.currency || '$';
  return sym + parseFloat(amount || 0).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function pct(rate) {
  return parseFloat(rate || 0).toFixed(2) + '%';
}

// ============================================================
// CALCULATIONS
// ============================================================
function getTotalDebt() {
  return appState.debts.reduce((s, d) => s + (parseFloat(d.balance) || 0), 0);
}

function getTotalMinPayments() {
  return appState.debts.reduce((s, d) => s + (parseFloat(d.minPayment) || 0), 0);
}

function getMonthlyIncome() {
  const weekly = (parseFloat(appState.income.weeklySalary) || 0) + (parseFloat(appState.income.additionalWeeklyIncome) || 0);
  return (weekly * 52) / 12;
}

function getWeeklyIncome() {
  return (parseFloat(appState.income.weeklySalary) || 0) + (parseFloat(appState.income.additionalWeeklyIncome) || 0);
}

function getWeeklyPayment() {
  const totalDebt = getTotalDebt();
  const weeks = (appState.settings.termYears || 5) * 52;
  const avgRate = getAverageInterestRate() / 100 / 52;
  if (avgRate === 0 || totalDebt === 0) return weeks > 0 ? totalDebt / weeks : 0;
  const payment = totalDebt * avgRate * Math.pow(1 + avgRate, weeks) / (Math.pow(1 + avgRate, weeks) - 1);
  return isFinite(payment) ? payment : totalDebt / weeks;
}

function getAverageInterestRate() {
  if (appState.debts.length === 0) return 0;
  const totalBalance = getTotalDebt();
  if (totalBalance === 0) return 0;
  return appState.debts.reduce((s, d) => s + (parseFloat(d.rate) || 0) * (parseFloat(d.balance) || 0), 0) / totalBalance;
}

function getTotalExpensesSinceStart() {
  if (!appState.settings.startDate) {
    return appState.dailyExpenses.reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
  }
  const start = new Date(appState.settings.startDate);
  return appState.dailyExpenses
    .filter(e => new Date(e.date) >= start)
    .reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
}

function getWeeksUntilDebtFree() {
  const totalDebt = getTotalDebt();
  const weeklyPayment = getWeeklyPayment();
  if (weeklyPayment <= 0 || totalDebt <= 0) return 0;
  return Math.ceil(totalDebt / weeklyPayment);
}

function getPayoffOrder() {
  const debts = [...appState.debts];
  const strategy = appState.settings.strategy || 'avalanche';
  if (strategy === 'avalanche') {
    return debts.sort((a, b) => (parseFloat(b.rate) || 0) - (parseFloat(a.rate) || 0));
  } else if (strategy === 'snowball') {
    return debts.sort((a, b) => (parseFloat(a.balance) || 0) - (parseFloat(b.balance) || 0));
  }
  return debts;
}

}

function processPayment(index) {
  const amount = parseFloat(document.getElementById('pmtAmount').value);
  const date = document.getElementById('pmtDate').value;
  const note = document.getElementById('pmtNote').value.trim();

  if (!amount || isNaN(amount) || amount <= 0) { alert('Enter a valid amount'); return; }

  const debt = appState.debts[index];
  debt.balance = Math.max(0, (parseFloat(debt.balance) || 0) - amount);
  debt.payments.push({ amount, date, note });

  // Deduct from bank balance
  appState.finances.bankBalance = Math.max(0, (appState.finances.bankBalance || 0) - amount);
  appState.finances.totalSaved = (appState.finances.totalSaved || 0) + amount;

  closeModal('paymentModal');
  scheduleSave();
  renderAll();
  alert(`Payment of ${cur(amount)} applied to ${debt.bank}. Remaining balance: ${cur(debt.balance)}`);
}

function applyInterest(index) {
  const debt = appState.debts[index];
  const monthlyRate = parseFloat(debt.rate) / 100 / 12;
  const interest = parseFloat(debt.balance) * monthlyRate;
  if (confirm(`Apply 1 month interest (${cur(interest)}) to ${debt.bank}?`)) {
    debt.balance = (parseFloat(debt.balance) || 0) + interest;
    scheduleSave();
    renderAll();
  }
}

        <div style="font-size:18px;font-weight:700;color:var(--yellow)">${weeks.length - paid.length}</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase">Total Paid</div>
        <div style="font-size:18px;font-weight:700;color:var(--green)">${cur(totalPaid)}</div>
      </div>
    </div>
    ${upcoming ? `<div style="margin-top:12px;padding:10px;background:rgba(108,99,255,0.1);border-radius:10px;border:1px solid rgba(108,99,255,0.3);font-size:13px">
      <strong>Next:</strong> ${upcoming.weekLabel} → ${cur(upcoming.amount)} to ${upcoming.targetDebt}
    </div>` : ''}
  `;
}

function generateWeeklyPlan() {
  if (appState.debts.length === 0 || !appState.settings.startDate) return [];

  const weeks = [];
  const startDate = new Date(appState.settings.startDate);
  const totalWeeks = (appState.settings.termYears || 5) * 52;
  const weeklyPayment = getWeeklyPayment();
  const orderedDebts = getPayoffOrder();

  let debtBalances = orderedDebts.map(d => ({ ...d, remaining: parseFloat(d.balance) || 0 }));
  let currentDebtIdx = 0;

  for (let i = 0; i < Math.min(totalWeeks, 260); i++) {
    const weekDate = new Date(startDate);
    weekDate.setDate(startDate.getDate() + i * 7);
    const key = weekDate.toISOString().split('T')[0];

    while (currentDebtIdx < debtBalances.length && debtBalances[currentDebtIdx].remaining <= 0) {
      currentDebtIdx++;
    }

    if (currentDebtIdx >= debtBalances.length) break;

    const currentDebt = debtBalances[currentDebtIdx];
    const payment = Math.min(weeklyPayment, currentDebt.remaining);
    currentDebt.remaining -= payment;

    weeks.push({
      key,
      weekLabel: `Week ${i + 1} — ${weekDate.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })}`,
      targetDebt: currentDebt.bank,
      amount: payment,
      weekNum: i + 1
    });
  }

  return weeks;
}

function renderTrackerList() {
  const list = document.getElementById('trackerList');
  if (!list) return;

  if (!appState.settings.startDate) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📅</div><p>Set a plan start date in the Plan tab to generate your payment tracker</p></div>`;
    return;
  }

  if (appState.debts.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">💳</div><p>Add debts first to generate tracker</p></div>`;
    return;
  }

  let weeks = generateWeeklyPlan();

  if (trackerFilter === 'paid') {
    weeks = weeks.filter(w => appState.tracker.paidWeeks[w.key]);
  } else if (trackerFilter === 'unpaid') {
    weeks = weeks.filter(w => !appState.tracker.paidWeeks[w.key]);
  }

  if (weeks.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">✅</div><p>No weeks match this filter</p></div>`;
    return;
  }

  // Show max 52 weeks at once for performance
  const display = weeks.slice(0, 52);

  list.innerHTML = display.map(w => {
    const isPaid = !!appState.tracker.paidWeeks[w.key];
    return `
      <div class="tracker-week ${isPaid ? 'paid' : ''}">
        <div class="tw-left">
          <div class="tw-week">${w.weekLabel}</div>
          <div class="tw-debt">🎯 ${w.targetDebt}</div>
        </div>
        <div class="tw-right">
          <div class="tw-amount">${cur(w.amount)}</div>
          ${isPaid
            ? `<span class="paid-badge">✓ PAID</span>`
            : `<span class="unpaid-badge" onclick="markWeekPaid('${w.key}')">Mark Paid</span>`
          }
        </div>
      </div>
    `;
  }).join('');

  if (weeks.length > 52) {
    list.innerHTML += `<div style="text-align:center;color:var(--muted);font-size:12px;padding:12px">Showing 52 of ${weeks.length} weeks</div>`;
  }
}

function markWeekPaid(key) {
  appState.tracker.paidWeeks[key] = true;
  // Deduct from bank balance
  const weeks = generateWeeklyPlan();
  const week = weeks.find(w => w.key === key);
  if (week) {
    appState.finances.bankBalance = Math.max(0, (appState.finances.bankBalance || 0) - week.amount);
    // Apply payment to matching debt
    const debtIdx = appState.debts.findIndex(d => d.bank === week.targetDebt);
    if (debtIdx >= 0) {
      appState.debts[debtIdx].balance = Math.max(0, (parseFloat(appState.debts[debtIdx].balance) || 0) - week.amount);
      appState.finances.totalSaved = (appState.finances.totalSaved || 0) + week.amount;
    }
  }
  scheduleSave();
  renderTracker();
  renderDashboard();
  renderDebts();
}

function renderPlan() {
  renderPlanSettings();
  renderPlanSummary();
  renderPayoffOrder();
}

function renderPlanSettings() {
  const startInput = document.getElementById('planStartDate');
  const termInput = document.getElementById('planTermYears');
  const stratInput = document.getElementById('planStrategy');

  if (startInput) startInput.value = appState.settings.startDate || '';
  if (termInput) termInput.value = appState.settings.termYears || 5;
  if (stratInput) stratInput.value = appState.settings.strategy || 'avalanche';
}

function renderPlanSummary() {
  const el = document.getElementById('planSummary');
  if (!el) return;

  const totalDebt = getTotalDebt();
  const weeklyPayment = getWeeklyPayment();
  const monthlyPayment = weeklyPayment * 52 / 12;
  const totalPayments = weeklyPayment * (appState.settings.termYears || 5) * 52;
  const totalInterest = Math.max(0, totalPayments - totalDebt);
  const debtFreeDate = getDebtFreeDate();
  const avgRate = getAverageInterestRate();

  el.innerHTML = `
    <div class="plan-item"><span class="pi-label">Total Debt</span><span class="pi-value" style="color:var(--red)">${cur(totalDebt)}</span></div>
    <div class="plan-item"><span class="pi-label">Average Interest Rate</span><span class="pi-value" style="color:var(--yellow)">${pct(avgRate)}</span></div>
    <div class="plan-item"><span class="pi-label">Weekly Payment Required</span><span class="pi-value" style="color:var(--accent)">${cur(weeklyPayment)}</span></div>
    <div class="plan-item"><span class="pi-label">Monthly Equivalent</span><span class="pi-value">${cur(monthlyPayment)}</span></div>
    <div class="plan-item"><span class="pi-label">Est. Total Interest</span><span class="pi-value" style="color:var(--red)">${cur(totalInterest)}</span></div>
    <div class="plan-item"><span class="pi-label">Target Debt Free Date</span><span class="pi-value" style="color:var(--green)">${debtFreeDate}</span></div>
    <div class="plan-item"><span class="pi-label">Strategy</span><span class="pi-value">${(appState.settings.strategy || 'avalanche').charAt(0).toUpperCase() + (appState.settings.strategy || 'avalanche').slice(1)}</span></div>
  `;
}

function renderPayoffOrder() {
  const el = document.getElementById('payoffOrder');
  if (!el) return;

  const ordered = getPayoffOrder();
  if (ordered.length === 0) {
    el.innerHTML = `<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px">Add debts to see payoff order</div>`;
    return;
  }

  el.innerHTML = ordered.map((d, i) => `
    <div class="plan-item">
      <span class="pi-label">${i + 1}. ${d.bank}</span>
      <span class="pi-value" style="color:${i === 0 ? 'var(--accent)' : 'var(--text)'}">
        ${cur(d.balance)} @ ${pct(d.rate)}
        ${i === 0 ? ' 🎯' : ''}
      </span>
    </div>
  `).join('');
}

function updatePlanSettings() {
  appState.settings.startDate = document.getElementById('planStartDate').value || null;
  appState.settings.termYears = parseInt(document.getElementById('planTermYears').value) || 5;
  appState.settings.strategy = document.getElementById('planStrategy').value || 'avalanche';
  scheduleSave();
  renderAll();
}

function renderSettings() {
  const country = document.getElementById('settingsCountry');
  const currency = document.getElementById('settingsCurrency');
  const interest = document.getElementById('settingsInterest');
  const warnings = document.getElementById('settingsWarnings');
  const storageInfo = document.getElementById('storageInfo');

  if (country) country.value = appState.country || 'Australia';
  if (currency) currency.value = appState.currency || '$';
  if (interest) interest.checked = appState.settings.applyInterest || false;
  if (warnings) warnings.checked = appState.settings.showWarnings !== false;
  if (storageInfo) storageInfo.textContent = `Debts: ${appState.debts.length} | Expenses: ${appState.dailyExpenses.length} | Records: ${appState.salaryHistory.length}`;
}

function saveSettings() {
  appState.country = document.getElementById('settingsCountry').value;
  appState.currency = document.getElementById('settingsCurrency').value;
  appState.settings.applyInterest = document.getElementById('settingsInterest').checked;
  appState.settings.showWarnings = document.getElementById('settingsWarnings').checked;
  scheduleSave();
  renderDashboard();
}

function exportData() {
  const json = JSON.stringify(appState, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `debt-destroyer-backup-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (confirm('Import this data? This will replace all current data.')) {
        appState = data;
        saveState();
        renderAll();
        alert('Data imported successfully ✓');
      }
    } catch(err) {
      alert('Invalid file format');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function confirmReset() {
  if (confirm('⚠️ Factory Reset: This will delete ALL data permanently.\n\nType OK to confirm.')) {
    resetApp();
  }
}

function resetApp() {
  appState = JSON.parse(JSON.stringify(DEFAULT_STATE));
  localforage.removeItem('debtDestroyerState').then(() => {
    renderAll();
    alert('App reset complete');
  });
}

// Apply interest monthly if enabled (check on load)
function checkMonthlyInterest() {
  if (!appState.settings.applyInterest) return;
  const lastApplied = appState.lastInterestApplied;
  const now = new Date();
  if (!lastApplied) {
    appState.lastInterestApplied = now.toISOString();
    return;
  }
  const last = new Date(lastApplied);
  const monthsDiff = (now.getFullYear() - last.getFullYear()) * 12 + (now.getMonth() - last.getMonth());
  if (monthsDiff >= 1) {
    appState.debts.forEach(d => {
      const rate = parseFloat(d.rate) / 100 / 12;
      d.balance = (parseFloat(d.balance) || 0) * (1 + rate);
    });
    appState.lastInterestApplied = now.toISOString();
    scheduleSave();
  }
}
