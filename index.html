* {

  margin: 0;
  padding: 0;

}

:root {
  --bg: #0a0a0f;

  --card: #1a1a26;
  --border: #2a2a3e;
  --accent: #6c63ff;
  --accent2: #ff6584;
  --green: #00d68f;
  --yellow: #ffb300;
  --red: #ff4d6d;
  --text: #e8e8f0;
  --muted: #7a7a9a;
  --radius: 14px;
}

html, body {
  min-height: 100%;

  color: var(--text);

  font-size: 15px;
}

/* ── HEADER ── */
.header {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  padding: 14px 16px 10px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 200;
}
.header h1 {
  font-size: 19px;
  font-weight: 800;
  background: linear-gradient(90deg, #6c63ff, #ff6584);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header p {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

/* ── TAB BAR ── */
.tab-bar {
  display: flex;
  overflow-x: auto;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 62px;
  z-index: 199;
  scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }

.tab-btn {

  cursor: pointer;

  transition: color 0.2s, border-color 0.2s;
}
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ── PAGES ── */
.page {

  max-width: 600px;
  margin: 0 auto;
  padding-bottom: 90px;
}
.page.active { display: block; }

/* ── CARDS ── */
.card {
  background: var(--card);

  padding: 14px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 11px;

}

   UTILS
───────────────────────────────────────── */
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

function $(id) { return document.getElementById(id); }

function cur(n) {
  const sym = S.currency || '$';
  return sym + parseFloat(n || 0).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function pct(n) { return parseFloat(n || 0).toFixed(2) + '%'; }

function fmtDate(str) {
  if (!str) return '—';
  const d = new Date(str);
  if (isNaN(d)) return str;
  return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
}

function today() { return new Date().toISOString().split('T')[0]; }

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg || '✓ Saved';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ─────────────────────────────────────────
   STORAGE  (IndexedDB via in-page minimal shim)
───────────────────────────────────────── */
const DB_NAME  = 'DebtDestroyerPro';
const DB_STORE = 'state';
const DB_KEY   = 'appState';

let db = null;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      e.target.result.createObjectStore(DB_STORE);
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror   = e => rej(e);
  });
}

function dbSave(data) {
  return new Promise((res, rej) => {
    if (!db) { localStorage.setItem(DB_KEY, JSON.stringify(data)); res(); return; }
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(data, DB_KEY);
    tx.oncomplete = res;
    tx.onerror    = rej;
  });
}

function dbLoad() {
  return new Promise((res, rej) => {
    if (!db) {
      try {
        const raw = localStorage.getItem(DB_KEY);
        res(raw ? JSON.parse(raw) : null);
      } catch(e) { res(null); }
      return;
    }
    const tx  = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(DB_KEY);
    req.onsuccess = e => res(e.target.result || null);
    req.onerror   = rej;
  });
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    await dbSave(S);
    showToast('✓ Saved');
    $('hdrStatus').textContent = 'Saved ' + new Date().toLocaleTimeString();
  }, 700);
}

/* ─────────────────────────────────────────
   CALCULATIONS
───────────────────────────────────────── */
function totalDebt() {
  return S.debts.reduce((a, d) => a + (parseFloat(d.balance) || 0), 0);
}
function totalMinMonthly() {
  return S.debts.reduce((a, d) => a + (parseFloat(d.minPay) || 0), 0);
}
function weeklyIncome() {
  return (parseFloat(S.income.weekly) || 0) + (parseFloat(S.income.extra) || 0);
}
function avgRate() {
  const tb = totalDebt();
  if (!tb) return 0;
  return S.debts.reduce((a, d) => a + (parseFloat(d.rate) || 0) * (parseFloat(d.balance) || 0), 0) / tb;
}
function weeklyPayment() {
  const td = totalDebt();
  const wk = (S.settings.termYears || 5) * 52;
  const r  = avgRate() / 100 / 52;
  if (!td || !wk) return 0;
  if (!r) return td / wk;
  const p = td * r * Math.pow(1 + r, wk) / (Math.pow(1 + r, wk) - 1);
  return isFinite(p) ? p : td / wk;
}
function weeksLeft() {
  const wp = weeklyPayment();
  const td = totalDebt();
  if (!wp || !td) return 0;
  return Math.ceil(td / wp);
}
function debtFreeDate() {
  const wl = weeksLeft();
  if (!wl) return 'N/A';
  const d = new Date();
  d.setDate(d.getDate() + wl * 7);
  return d.toLocaleDateString('en-AU', { month: 'short', year: 'numeric' });
}
function sortedDebts() {
  const arr = [...S.debts];
  const st  = S.settings.strategy;
  if (st === 'avalanche') return arr.sort((a, b) => (parseFloat(b.rate) || 0) - (parseFloat(a.rate) || 0));
  if (st === 'snowball')  return arr.sort((a, b) => (parseFloat(a.balance) || 0) - (parseFloat(b.balance) || 0));
  return arr;
}
function weekExpenses(type) {
  const now  = new Date();
  const wStart = new Date(now); wStart.setDate(now.getDate() - now.getDay()); wStart.setHours(0,0,0,0);
  const mStart = new Date(now.getFullYear(), now.getMonth(), 1);
  return S.expenses.filter(e => {
    const d = new Date(e.date);
    if (type === 'week')  return d >= wStart;
    if (type === 'month') return d >= mStart;
    return true;
  }).reduce((a, e) => a + (parseFloat(e.amount) || 0), 0);
}

/* ─────────────────────────────────────────
   GENERATE WEEKLY PLAN
───────────────────────────────────────── */
function buildWeeklyPlan() {
  if (!S.settings.startDate || !S.debts.length) return [];
  const start = new Date(S.settings.startDate);
  const totalWk = (S.settings.termYears || 5) * 52;
  const wPay    = weeklyPayment();
  const ordered = sortedDebts().map(d => ({ ...d, rem: parseFloat(d.balance) || 0 }));
  const plan    = [];
  let di = 0;

  for (let i = 0; i < Math.min(totalWk, 520) && di < ordered.length; i++) {
    while (di < ordered.length && ordered[di].rem <= 0.005) di++;
    if (di >= ordered.length) break;

    const dt = new Date(start);
    dt.setDate(start.getDate() + i * 7);
    const key    = dt.toISOString().split('T')[0];
    const pmt    = Math.min(wPay, ordered[di].rem);
    ordered[di].rem -= pmt;

    plan.push({
      key,
      label: `Week ${i + 1} — ${fmtDate(key)}`,
      debt:  ordered[di].bank,
      amount: pmt,
      num: i + 1
    });
  }
  return plan;
}

function deleteDebt(i) {
  if (!confirm(`Delete "${S.debts[i].bank}"? This cannot be undone.`)) return;
  S.debts.splice(i, 1);
  scheduleSave();
  renderAll();
}

function openPayModal(i) {
  payingDebtIdx = i;
  const d = S.debts[i];
  $('mdPayBody').innerHTML = `
    <div style="margin-bottom:12px">
      <div style="font-size:15px;font-weight:700">${d.bank}</div>
      <div style="font-size:12px;color:var(--muted)">${d.typeLabel} &nbsp;|&nbsp; Balance: ${cur(d.balance)}</div>
    </div>
    <div class="form-group">
      <label>Payment Amount ($)</label>
      <input type="number" id="pmtAmt" value="${d.minPay || ''}" placeholder="Amount" inputmode="decimal">
    </div>
    <div class="form-group">
      <label>Date</label>
      <input type="date" id="pmtDate" value="${today()}">
    </div>
    <div class="form-group">
      <label>Note (optional)</label>
      <input type="text" id="pmtNote" placeholder="e.g. Monthly minimum">
    </div>
    <div class="btn-row">
      <button class="btn btn-outline" data-close="mdPay">Cancel</button>
      <button class="btn btn-green" id="btnConfirmPay">✅ Confirm Payment</button>
    </div>
  `;
  $('btnConfirmPay').onclick = confirmPayment;
  openOverlay('mdPay');
}

function confirmPayment() {
  const amt  = parseFloat($('pmtAmt').value);
  const dt   = $('pmtDate').value;
  const note = $('pmtNote').value.trim();
  if (!amt || amt <= 0)  { alert('Enter a valid amount'); return; }
  const d = S.debts[payingDebtIdx];
  d.balance = Math.max(0, (parseFloat(d.balance) || 0) - amt);
  d.payments = d.payments || [];
  d.payments.push({ amt, dt, note });
  S.finances.bankBalance = Math.max(0, (S.finances.bankBalance || 0) - amt);
  S.finances.totalSaved  = (S.finances.totalSaved || 0) + amt;
  closeOverlay('mdPay');
  scheduleSave();
  renderAll();
  showToast(`${cur(amt)} applied to ${d.bank}`);
}

function applyInterest(i) {
  const d  = S.debts[i];
  const r  = parseFloat(d.rate) / 100 / 12;
  const mi = parseFloat(d.balance) * r;
  if (!confirm(`Apply 1 month interest (${cur(mi)}) to ${d.bank}?`)) return;
  d.balance = (parseFloat(d.balance) || 0) + mi;
  scheduleSave();
  renderAll();
  showToast('Interest applied');
}

/* Add Debt */
function initDebtModal() {
  $('btnAddDebt').onclick = () => openOverlay('mdDebt');

  $('dBank').addEventListener('change', function () {
    $('dCustomWrap').style.display = this.value === '__custom__' ? 'block' : 'none';
  });

  $('dType').addEventListener('change', function () {
    const hints = {
      credit:   '💡 Typical credit card: 18–22% p.a.',
      personal: '💡 Typical personal loan: 8–15% p.a.',
      home:     '💡 Typical home loan: 5–7% p.a.',
      car:      '💡 Typical car loan: 6–12% p.a.',
      student:  '💡 HECS indexed to CPI (~4–7%). Private higher.',
      bnpl:     '💡 BNPL: 0% if on time; late fees apply.',
      tax:      '💡 ATO general interest charge ~11% p.a.',
      other:    ''
    };
    $('rateHint').textContent = hints[this.value] || '';
  });

  $('btnSaveDebt').onclick = saveDebt;
}

function saveDebt() {
  const bankRaw = $('dBank').value;
  const bank = bankRaw === '__custom__' ? $('dCustomBank').value.trim() : bankRaw;
  const typeKey = $('dType').value;
  const typeLabels = { credit:'Credit Card', personal:'Personal Loan', home:'Home Loan', car:'Car Loan', student:'Student Loan', bnpl:'Buy Now Pay Later', tax:'Tax / Gov Debt', other:'Other' };
  const balance = parseFloat($('dBalance').value);

  if (!bank)                     { alert('Please select a bank / lender'); return; }
  if (!balance || balance <= 0)  { alert('Please enter a valid balance'); return; }

  S.debts.push({
    id:       Date.now(),
    bank,
    typeKey,
    typeLabel: typeLabels[typeKey] || typeKey,
    balance,
    origBal:  balance,
    limit:    parseFloat($('dLimit').value)  || 0,
    rate:     parseFloat($('dRate').value)   || 0,
    minPay:   parseFloat($('dMinPay').value) || 0,
    dueDate:  $('dDueDate').value || null,
    notes:    $('dNotes').value.trim(),
    addedOn:  today(),
    payments: []
  });

  // clear form
  ['dBank','dCustomBank','dBalance','dLimit','dRate','dMinPay','dDueDate','dNotes'].forEach(id => { $(id).value = ''; });
  $('dCustomWrap').style.display = 'none';
  closeOverlay('mdDebt');
  scheduleSave();
  renderAll();
  showToast('Debt added ✓');
}

    S.income.weekly = parseFloat($('fWeeklySal').value) || 0;
    S.income.extra  = parseFloat($('fAddWeekly').value) || 0;
    scheduleSave();
    renderAll();
    showToast('Income saved ✓');
  };
  $('btnSetBal').onclick = () => {
    const v = parseFloat($('fBankBal').value);
    if (isNaN(v)) { alert('Enter a valid amount'); return; }
    S.finances.bankBalance = v;
    scheduleSave();
    renderIncome();
    renderDashboard();
    showToast('Balance updated ✓');
  };
  $('btnRecordSal').onclick = () => {
    const amt = parseFloat($('fSalAmt').value);
    const dt  = $('fSalDate').value;
    if (!amt || amt <= 0) { alert('Enter a valid amount'); return; }
    if (!dt) { alert('Select a date'); return; }
    S.finances.bankBalance = (S.finances.bankBalance || 0) + amt;
    S.salaryLog.unshift({ amt, dt, type: 'salary', note: 'Salary' });
    $('fSalAmt').value = '';
    scheduleSave();
    renderAll();
    showToast(`${cur(amt)} added to balance ✓`);
  };
  $('btnAddSav').onclick = () => {
    const amt  = parseFloat($('fSavAmt').value);
    const note = $('fSavNote').value.trim();
    if (!amt || amt <= 0) { alert('Enter a valid amount'); return; }
    S.finances.bankBalance = (S.finances.bankBalance || 0) + amt;
    S.finances.totalSaved  = (S.finances.totalSaved  || 0) + amt;

    $('fSavAmt').value  = '';
    $('fSavNote').value = '';
    scheduleSave();
    renderAll();
    showToast(`${cur(amt)} saved ✓`);
  };
}

    $('expList').innerHTML = `<div class="empty"><div class="ei">🧾</div><p>No expenses logged yet</p></div>`;

  $('expList').innerHTML = list.map((e, ri) => {
    const realIdx = S.expenses.length - 1 - ri;
    return `
      <div class="exp-item">
        <div class="exp-left">
          <div class="exp-name">${e.cat}${e.note ? ' — ' + e.note : ''}</div>
          <div class="exp-date">${fmtDate(e.date)}</div>
        </div>
        <div class="exp-right">
          <div class="exp-amount">−${cur(e.amount)}</div>
          <button class="del-btn" style="position:static" onclick="deleteExp(${realIdx})">✕</button>
        </div>
      </div>`;
  }).join('');
}

function initExpenses() {
  $('btnAddExp').onclick = () => {
    const amt  = parseFloat($('fExpAmt').value);
    const date = $('fExpDate').value;
    const cat  = $('fExpCat').value;
    const note = $('fExpNote').value.trim();
    if (!amt || amt <= 0) { alert('Enter a valid amount'); return; }
    if (!date) { alert('Select a date'); return; }
    S.expenses.push({ amount: amt, date, cat, note, id: Date.now() });
    S.finances.bankBalance  = Math.max(0, (S.finances.bankBalance  || 0) - amt);
    S.finances.totalExpenses = (S.finances.totalExpenses || 0) + amt;
    $('fExpAmt').value  = '';
    $('fExpNote').value = '';
    scheduleSave();
    renderAll();
    showToast(`${cur(amt)} logged ✓`);
  };
}

function deleteExp(i) {
  if (!confirm('Delete this expense?')) return;
  const e = S.expenses[i];
  S.finances.bankBalance = (S.finances.bankBalance || 0) + (parseFloat(e.amount) || 0);
  S.expenses.splice(i, 1);
  scheduleSave();
  renderAll();
}

    <div class="row3">
      <div style="text-align:center"><div style="font-size:10px;color:var(--muted);text-transform:uppercase">Paid</div><div style="font-size:20px;font-weight:800;color:var(--green)">${paid.length}</div></div>
      <div style="text-align:center"><div style="font-size:10px;color:var(--muted);text-transform:uppercase">Remaining</div><div style="font-size:20px;font-weight:800;color:var(--yellow)">${plan.length - paid.length}</div></div>
      <div style="text-align:center"><div style="font-size:10px;color:var(--muted);text-transform:uppercase">Amount Paid</div><div style="font-size:20px;font-weight:800;color:var(--green)">${cur(paidAmt)}</div></div>
    </div>
    ${next ? `<div style="margin-top:11px;padding:9px 12px;background:rgba(108,99,255,.1);border:1px solid rgba(108,99,255,.3);border-radius:10px;font-size:13px"><strong>Next:</strong> ${next.label} → ${cur(next.amount)} to <strong>${next.debt}</strong></div>` : ''}
  `;
}

function renderTrackerList() {
  const plan = buildWeeklyPlan();

  if (!S.settings.startDate) {
    $('trackList').innerHTML = `<div class="empty"><div class="ei">📅</div><p>Set a Plan Start Date in the Plan tab to generate your tracker</p></div>`;
    return;
  }
  if (!S.debts.length) {
    $('trackList').innerHTML = `<div class="empty"><div class="ei">💳</div><p>Add debts first</p></div>`;
    return;
  }

  let view = plan;
  if (trackFilter === 'paid')   view = plan.filter(w =>  S.tracker.paid[w.key]);
  if (trackFilter === 'unpaid') view = plan.filter(w => !S.tracker.paid[w.key]);

  const show = view.slice(0, 104);
  $('trackList').innerHTML = show.map(w => {
    const isPaid = !!S.tracker.paid[w.key];
    return `
      <div class="track-item${isPaid ? ' paid-row' : ''}">
        <div class="track-left">
          <div class="tw-week">${w.label}</div>
          <div class="tw-debt">🎯 ${w.debt}</div>
        </div>
        <div class="track-right">
          <div class="track-amount">${cur(w.amount)}</div>
          ${isPaid
            ? `<span class="badge-paid">✓ PAID</span>`
            : `<button class="badge-unpaid" onclick="markPaid('${w.key}')">Mark Paid</button>`}
        </div>
      </div>`;
  }).join('') + (view.length > 104 ? `<div style="text-align:center;color:var(--muted);font-size:12px;padding:10px">Showing 104 of ${view.length} weeks</div>` : '');
}

function markPaid(key) {
  S.tracker.paid[key] = true;
  const plan = buildWeeklyPlan();
  const w    = plan.find(x => x.key === key);
  if (w) {
    S.finances.bankBalance = Math.max(0, (S.finances.bankBalance || 0) - w.amount);
    S.finances.totalSaved  = (S.finances.totalSaved || 0) + w.amount;
    const di = S.debts.findIndex(d => d.bank === w.debt);
    if (di >= 0) S.debts[di].balance = Math.max(0, (parseFloat(S.debts[di].balance) || 0) - w.amount);
  }
  scheduleSave();
  renderAll();
}

function initTracker() {
  $('trackChips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    trackFilter = chip.dataset.f;
    document.querySelectorAll('#trackChips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    renderTrackerList();
  });
}

/* ─────────────────────────────────────────
   PLAN
───────────────────────────────────────── */
function renderPlan() {
  $('fPlanStart').value = S.settings.startDate || '';
  $('fPlanTerm').value  = S.settings.termYears || 5;
  $('fPlanStrat').value = S.settings.strategy  || 'avalanche';
  renderPlanSummary();
  renderPayoffOrder();
}

function renderPlanSummary() {
  const td   = totalDebt();
  const wp   = weeklyPayment();
  const mp   = wp * 52 / 12;
  const wk   = (S.settings.termYears || 5) * 52;
  const tot  = wp * wk;
  const int_ = Math.max(0, tot - td);
  $('planSummary').innerHTML = `
    <div class="plan-row"><span class="pl">Total Debt</span><span class="pv c-red">${cur(td)}</span></div>
    <div class="plan-row"><span class="pl">Avg Interest Rate</span><span class="pv c-yellow">${pct_(avgRate())}</span></div>
    <div class="plan-row"><span class="pl">Weekly Payment</span><span class="pv c-purple">${cur(wp)}</span></div>
    <div class="plan-row"><span class="pl">Monthly Equivalent</span><span class="pv">${cur(mp)}</span></div>
    <div class="plan-row"><span class="pl">Est. Total Interest</span><span class="pv c-red">${cur(int_)}</span></div>
    <div class="plan-row"><span class="pl">Debt-Free Date</span><span class="pv c-green">${debtFreeDate()}</span></div>
    <div class="plan-row"><span class="pl">Strategy</span><span class="pv">${(S.settings.strategy || 'Avalanche')}</span></div>
  `;
}

function renderPayoffOrder() {
  const od = sortedDebts();
  $('payoffOrder').innerHTML = od.length ? od.map((d, i) => `
    <div class="plan-row">
      <span class="pl">${i + 1}. ${d.bank}</span>
      <span class="pv" style="color:${i === 0 ? 'var(--accent)' : 'var(--text)'}">${cur(d.balance)} @ ${pct_(d.rate)} ${i === 0 ? '🎯' : ''}</span>
    </div>`).join('')
    : `<div style="color:var(--muted);font-size:13px;text-align:center;padding:14px">Add debts to see payoff order</div>`;
}

function initPlan() {
  $('btnSavePlan').onclick = () => {
    S.settings.startDate = $('fPlanStart').value || null;
    S.settings.termYears = parseInt($('fPlanTerm').value) || 5;
    S.settings.strategy  = $('fPlanStrat').value || 'avalanche';
    scheduleSave();
    renderAll();
    showToast('Plan settings saved ✓');
  };
}

/* ─────────────────────────────────────────
   SALARY
───────────────────────────────────────── */
function renderSalary() {
  const total = S.salaryLog.reduce((a, h) => a + (parseFloat(h.amt) || 0), 0);
  const wi = weeklyIncome();
  $('salSummary').innerHTML = `
    <div class="plan-row"><span class="pl">Weekly Salary</span><span class="pv c-green">${cur(S.income.weekly)}</span></div>
    <div class="plan-row"><span class="pl">Additional Weekly</span><span class="pv c-green">${cur(S.income.extra)}</span></div>
    <div class="plan-row"><span class="pl">Total Weekly Income</span><span class="pv c-green">${cur(wi)}</span></div>
    <div class="plan-row"><span class="pl">Monthly Equivalent</span><span class="pv">${cur(wi * 52 / 12)}</span></div>
    <div class="plan-row"><span class="pl">Annual Equivalent</span><span class="pv">${cur(wi * 52)}</span></div>
    <div class="plan-row"><span class="pl">Total Recorded</span><span class="pv">${cur(total)}</span></div>
    <div class="plan-row"><span class="pl">Records Count</span><span class="pv">${S.salaryLog.length}</span></div>
  `;

  if (!S.salaryLog.length) {
    $('salList').innerHTML = `<div class="empty"><div class="ei">📈</div><p>No payments recorded yet</p></div>`;
    return;
  }
  $('salList').innerHTML = S.salaryLog.slice(0, 60).map(h => `
    <div class="sal-item">
      <div class="sal-left">
        <div class="sal-name">${h.type === 'savings' ? '💰 ' : '💵 '}${h.note || (h.type === 'salary' ? 'Salary' : 'Payment')}</div>
        <div class="sal-date">${fmtDate(h.dt)}</div>
      </div>
      <div class="sal-amount">+${cur(h.amt)}</div>
    </div>`).join('');
}

/* ─────────────────────────────────────────
   SETTINGS
───────────────────────────────────────── */
function renderSettings() {
  $('fCountry').value  = S.country   || 'Australia';
  $('fCurrency').value = S.currency  || '$';
  $('tInterest').checked = S.settings.autoInterest || false;
  $('tWarnings').checked = S.settings.warnings !== false;
  $('appInfo').innerHTML = `
    Debt Destroyer Pro v4.0<br>
    Storage: IndexedDB (Safari-safe)<br>
    Debts: ${S.debts.length} &nbsp;|&nbsp; Expenses: ${S.expenses.length} &nbsp;|&nbsp; Records: ${S.salaryLog.length}<br>
    Auto-clears 1 year after plan end date
  `;
}

function initSettings() {
  $('btnSaveSettings').onclick = () => {
    S.country  = $('fCountry').value;
    S.currency = $('fCurrency').value;
    S.settings.autoInterest = $('tInterest').checked;
    S.settings.warnings     = $('tWarnings').checked;
    scheduleSave();
    renderAll();
    showToast('Settings saved ✓');
  };
  $('btnExport').onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `debt-destroyer-${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  $('btnImportTrig').onclick = () => $('fImport').click();
  $('fImport').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (confirm('Replace all current data with imported backup?')) {
          S = data;
          dbSave(S);
          renderAll();
          showToast('Import successful ✓');
        }
      } catch { alert('Invalid JSON file'); }
    };
    r.readAsText(f);
    e.target.value = '';
  };
  $('btnReset').onclick = () => {
    if (confirm('⚠️ FACTORY RESET\n\nThis permanently deletes ALL data.\n\nTap OK to confirm.')) {
      S = deepClone(DEFAULTS);
      dbSave(S);
      renderAll();
      showToast('App reset');
    }
  };
}

/* ─────────────────────────────────────────
   MODALS
───────────────────────────────────────── */
function openOverlay(id)  { $(id).classList.add('open'); }
function closeOverlay(id) { $(id).classList.remove('open'); }

function initModals() {
  document.addEventListener('click', e => {
    const closeBtn = e.target.closest('[data-close]');
    if (closeBtn) closeOverlay(closeBtn.dataset.close);
    if (e.target.classList.contains('overlay')) closeOverlay(e.target.id);
  });
}

/* ─────────────────────────────────────────
   AUTO CLEANUP
───────────────────────────────────────── */
function checkCleanup() {
  if (!S.settings.startDate) return;
  const end = new Date(S.settings.startDate);
  end.setFullYear(end.getFullYear() + (S.settings.termYears || 5) + 1);
  if (new Date() > end && confirm('Your debt plan period has ended. Clear all data and start fresh?')) {
    S = deepClone(DEFAULTS);
    dbSave(S);
    renderAll();
  }
}

/* ─────────────────────────────────────────
   BOOT
───────────────────────────────────────── */
async function boot() {
  try {
    await openDB();
  } catch (e) {
    console.warn('IndexedDB unavailable, using localStorage fallback', e);
  }

  try {
    const saved = await dbLoad();
    if (saved) {
      // Merge saved state into defaults to fill any missing keys
      S = Object.assign(deepClone(DEFAULTS), saved);
      S.finances = Object.assign(deepClone(DEFAULTS.finances), saved.finances || {});
      S.income   = Object.assign(deepClone(DEFAULTS.income),   saved.income   || {});
      S.settings = Object.assign(deepClone(DEFAULTS.settings), saved.settings || {});
      S.tracker  = Object.assign(deepClone(DEFAULTS.tracker),  saved.tracker  || {});
      if (!S.tracker.paid) S.tracker.paid = {};
      if (!Array.isArray(S.debts))     S.debts     = [];
      if (!Array.isArray(S.expenses))  S.expenses  = [];
      if (!Array.isArray(S.salaryLog)) S.salaryLog = [];
    }
  } catch (e) {
    console.error('Load failed', e);
  }

  checkCleanup();

  // Set default dates
  $('fExpDate').value  = today();
  $('fSalDate').value  = today();

  // Init all event listeners
  initTabs();
  initDebtModal();
  initIncome();
  initExpenses();
  initTracker();
  initPlan();
  initSettings();
  initModals();

  // First render
  renderDashboard();

  $('hdrStatus').textContent = 'Ready';
}

// Start the app
boot().catch(err => {
  console.error('Boot error', err);
  $('hdrStatus').textContent = 'Error — check console';
});
</script>
